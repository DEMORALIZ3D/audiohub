name: AudioHub CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx pip-audit

      - name: Backend Dependency CVE Security Audit
        run: |
          pip-audit -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite:////tmp/audiohub_backend_test.db
          DATA_DIR: /tmp/audiohub_backend_data
          SECRET_KEY: test-secret-key-backend-ci
        run: |
          mkdir -p /tmp/audiohub_backend_data
          pytest backend/tests -v

  frontend-quality-and-tests:
    name: Frontend Quality, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Biome Linter Check
        working-directory: frontend
        run: npm run lint

      - name: Fallow Dead-Code Analysis
        working-directory: frontend
        run: npm run fallow:dead

      - name: Production Dependency CVE Security Audit
        working-directory: frontend
        run: npm run audit:prod

      - name: Vitest Unit & Component Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Production Build
        working-directory: frontend
        run: npm run build

  e2e-playwright:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt uvicorn httpx

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend for SPA serving
        working-directory: frontend
        run: npm run build

      - name: Start backend server & wait for health check
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/audiohub_e2e_test.db
          DATA_DIR: /tmp/audiohub_e2e_data
          SECRET_KEY: test-secret-key-e2e-ci
        run: |
          mkdir -p /tmp/audiohub_e2e_data
          python -m uvicorn app.main:app --host 127.0.0.1 --port 4533 &
          timeout 30 bash -c 'until curl -fs http://127.0.0.1:4533/api/v1/health; do sleep 1; done'

      - name: Run Playwright E2E Suite
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:4533
        run: npm run test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
